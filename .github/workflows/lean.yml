name: Lean proof

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lean-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Verify release
        run: python scripts/verify_release.py
