related_formalizations: []

status:
  scope: >-
    The selected declarations expose the prepared-mode restriction of the
    action, the exact C19 symbol and its bounded low-momentum remainder, the
    cubical first-order square identity, the actual centered-recurrence
    residual bound, and the tangent local continuity law. The preparation is
    assumed rather than dynamically selected. No theorem establishes a
    localized electron, physical spin one-half, nonlinear live-chi closure,
    electromagnetic coupling, uniqueness, or canonical LFM physics.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - "LFMDiracChallenge.action_to_tangent_symbol"
    - "LFMDiracChallenge.exact_c19_symbol_split"
    - "LFMDiracChallenge.c19_spatial_remainder_control"
    - "LFMDiracChallenge.cubical_dirac_square"
    - "LFMDiracChallenge.controlled_centered_dirac_residual"
    - "LFMDiracChallenge.native_tangent_local_continuity"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex"]
      framework: "Codex desktop"
      tool_setup: "Human-directed AI-assisted Lean development, compilation, adversarial audits, independent numerical checks, and submission preparation"
      cost:
        wall_time: "multi-session research program"
        spend_usd: "subscription-based; not tracked"
        hardware: "local Windows workstation and GitHub Actions"
      prompting_notes: >-
        The human supplied the physical hypotheses, scope boundaries, and
        repeated red-team requirements. The agent implemented and checked the
        Lean development and prepared this disclosure.
  spend_usd: "subscription-based; not tracked"
  notes: >-
    Challenge.lean contains only the auditable statement surface; Solution.lean
    connects it to the production proof chain. The full Palomar preflight must
    pass on the submitted commit.

fidelity:
  divergences: >-
    Historical priority and originality are unestablished and are not claimed.
    The repository's broader physical interpretation has been narrowed here to
    the conditional prepared-tangent theorem that Lean actually checks. The
    literature search and its limitations are recorded in
    docs/PALOMAR_LITERATURE_REVIEW.md.

review:
  status: "self-assessed and agent-reviewed"
  reviewers:
    - "G. D. Partin"
    - "OpenAI Codex"
  notes: >-
    The selected declarations were checked against the production theorem
    chain, permitted-axiom list, clean build, Comparator, and Palomar full
    preflight. No independent expert peer review has been completed.

alignment:
  namespace: "LFMDiracChallenge"
  statements:
    - source: "Prepared uniform-chi restriction of the native local-plus-C19-bond action"
      lean: "LFMDiracChallenge.action_to_tangent_symbol"
      module: "Solution"
      status: "proved"
      note: "Expands the restricted action and exposes both the tangent coefficient and quartic remainder."
    - source: "Exact C19 Fourier symbol"
      lean: "LFMDiracChallenge.exact_c19_symbol_split"
      module: "Solution"
      status: "proved"
      note: "Separates the exact lattice symbol into its quadratic part and explicit remainder."
    - source: "Low-momentum C19 remainder estimate"
      lean: "LFMDiracChallenge.c19_spatial_remainder_control"
      module: "Solution"
      status: "proved"
      note: "Bounds the retained finite-spacing correction under explicit momentum hypotheses."
    - source: "Signed cubical incidence factorization"
      lean: "LFMDiracChallenge.cubical_dirac_square"
      module: "Solution"
      status: "proved"
      note: "Proves that the concrete eight-corner first-order operator squares to the isotropic quadratic symbol."
    - source: "Centered native recurrence"
      lean: "LFMDiracChallenge.controlled_centered_dirac_residual"
      module: "Solution"
      status: "proved"
      note: "Combines the explicit temporal and spatial corrections without claiming finite-spacing equality."
    - source: "Phase variation of the tangent C19 bond action"
      lean: "LFMDiracChallenge.native_tangent_local_continuity"
      module: "Solution"
      status: "proved"
      note: "Derives the exact sitewise phase-density/current continuity identity."

acknowledgements: "Lean, Mathlib, Palomar Registry, OpenAI Codex, and public reviewers of the repository."
