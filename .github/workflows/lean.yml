name: Lean proof

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lean-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          build: false
      - name: Verify release
        run: python scripts/verify_release.py
      - name: Build deterministic DIRAC-017 publication package
        run: python scripts/build_publication_package.py --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LeanDiracDerivation-DIRAC-017
          path: |
            dist/LeanDiracDerivation-DIRAC-017.zip
            dist/LeanDiracDerivation-DIRAC-017.zip.sha256
          if-no-files-found: error
          retention-days: 90
