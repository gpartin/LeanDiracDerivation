version: "v0.4"

project:
  name: "Action-derived C19 tangent and controlled cubical Dirac limit"
  description: >-
    A Lean formalization for the prepared uniform-chi tangent sector of a
    positive two-field cubic-lattice action. It derives the massive C19
    Klein--Gordon tangent, splits the exact lattice symbol into its isotropic
    quadratic part and a bounded fourth-order spatial remainder, proves that a
    signed cube-incidence first-order operator squares to that quadratic
    symbol, bounds the combined centered-time and finite-spacing residual, and
    derives an exact local phase-continuity identity from the same tangent bond
    action. The result is conditional and does not claim a localized electron,
    physical spin, nonlinear live-chi closure, or an exact finite-spacing
    Dirac equation.
  authors:
    - "G. D. Partin"
  license: "CC0-1.0"
  responsible_maintainers:
    - "G. D. Partin"

