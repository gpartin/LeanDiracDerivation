version: "v0.4"

project:
  name: "Native-action restriction and recurrence-derived C19 Dirac limit"
  description: >-
    A Lean formalization for a prepared uniform-chi sector of a positive
    two-field C19 cubic-lattice action. It proves that the full action and its
    first variation restrict exactly to the aligned eight-site coordinates,
    derives the massive C19 Klein--Gordon tangent and its controlled spatial
    remainder, proves a cubical first-order square root, and constructs the
    first-order branch from the centered recurrence's characteristic roots.
    The exact native branch defect is the C19 spatial remainder and the branch
    generator converges to the derived Dirac Hamiltonian. The same action also
    supplies a local continuity identity. The result is conditional and does
    not claim a localized electron, physical spin, nonlinear live-chi closure,
    or an exact finite-spacing Dirac equation.
  authors:
    - "G. D. Partin"
  license: "CC0-1.0"
  responsible_maintainers:
    - "G. D. Partin"

