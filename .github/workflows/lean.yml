name: Lean proof

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lean-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          build: false
      - name: Verify release
        run: python scripts/verify_release.py
      - name: Verify V3.2 Route-1 closure
        run: python scripts/verify_v32_research.py
      - name: Verify V3.3 free-spinor observable closure
        run: python scripts/verify_v33_research.py
      - name: Verify V3.5 covariant-observable closure
        run: python scripts/verify_v35_research.py
