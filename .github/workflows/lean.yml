name: Lean proof

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lean-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Verify release
        run: python scripts/verify_release.py
      - name: Build deterministic DIRAC-015 publication package
        run: python scripts/build_publication_package.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: LeanDiracDerivation-DIRAC-015
          path: |
            dist/LeanDiracDerivation-DIRAC-015.zip
            dist/LeanDiracDerivation-DIRAC-015.zip.sha256
